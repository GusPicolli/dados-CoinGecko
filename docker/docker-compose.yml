version: "3.8"

services:
  ingestion:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: dados_coingecko_ingestion
    environment:
      RAW_PATH: ${RAW_PATH_DOCKER}
      WORK_PATH: ${WORK_PATH_DOCKER}
      RAW_CONFIG: ${RAW_CONFIG_DOCKER}
      WORK_CONFIG: ${WORK_CONFIG_DOCKER}
    volumes:
      - shared-data:/app/AWS/S3/RAW
    command: ["python", "-c", "from app import ingestion_handler; ingestion_handler({'subsource': 'coingecko'})"]

  preparation:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: dados_coingecko_preparation
    depends_on:
      - ingestion
    environment:
      RAW_PATH: ${RAW_PATH_DOCKER}
      WORK_PATH: ${WORK_PATH_DOCKER}
      RAW_CONFIG: ${RAW_CONFIG_DOCKER}
      WORK_CONFIG: ${WORK_CONFIG_DOCKER}
    volumes:
      - shared-data:/app/AWS/S3/RAW
    command: ["python", "-c", "from app import preparation_handler; preparation_handler({'subsource': 'coingecko'})"]

  airflow:
    image: apache/airflow:2.6.0
    container_name: airflow
    ports:
      - "8080:8080"  # Porta para acessar a interface web do Airflow
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor 
    volumes:
      - ./dags:/opt/airflow/dags  # Diretório para os DAGs do Airflow
      - shared-data:/app/AWS/S3/RAW  # Para compartilhar dados com Airflow
    command: ["airflow", "standalone"]  # Inicializa o Airflow em modo autônomo

volumes:
  shared-data:
    driver: local